const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(){
  const pw = document.getElementById('pw').value.trim();
  const err = document.getElementById('err'); err.textContent = '';
  if (!pw) return;
  try {
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(V.salt), iterations:200000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(V.iv)}, key, b64(V.ct));
    const html = new TextDecoder().decode(pt);
    document.body.style.background = '#fff';
    document.getElementById('gate').remove();
    const host = document.createElement('div');
    host.innerHTML = html;
    document.body.appendChild(host);
    host.querySelectorAll('script').forEach(old => { const s = document.createElement('script'); s.textContent = old.textContent; old.replaceWith(s); });
    window.scrollTo(0,0);
  } catch(e) {
    err.textContent = 'That code is not correct. Please try again.';
  }
}
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
